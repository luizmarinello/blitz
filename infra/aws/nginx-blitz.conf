# /etc/nginx/sites-available/blitz  (R07)
# Front do Blitz (build estático do Vite) servido pelo Nginx; /api encaminhado ao back-end Spring em 127.0.0.1:8080.
# Front e API na mesma origem: sem CORS e com cookie de sessão SameSite=Strict.
# O bloco HTTPS (443) é acrescentado pelo Certbot via ativar-https.sh (R09).

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # o ativar-https.sh troca pelo domínio (ex.: 18-225-117-192.sslip.io)

    root /var/www/blitz;
    index index.html;

    # Cabeçalhos de segurança básicos (R09)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;            # o Blitz não recebe upload de arquivo
    server_tokens off;                  # não divulga a versão do Nginx

    # API: proxy reverso para o serviço systemd blitz (porta interna, não exposta no Security Group)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome (assets do Vite) podem ficar em cache por muito tempo
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Front: a navegação usa #/rotas, então o index.html atende tudo que não for arquivo
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
