<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Blitz: o aplicativo que não só organiza suas tarefas, mas decide com você o que fazer agora." />
    <meta name="theme-color" content="#F5F5F7" />
    <title>Blitz</title>
    <link rel="icon" type="image/png" href="/icone.png" />
    <script>
      // RN08: preferências valem em todas as telas, inclusive antes do login. Aplica o que ficou salvo localmente.
      try {
        var p = JSON.parse(localStorage.getItem('blitz.prefs') || '{}');
        var h = document.documentElement;
        // ponytail: migração única do escuro (antigo padrão) para o claro neste navegador; pode sair depois da homologação
        if (p.tema === 'ESCURO' && !localStorage.getItem('blitz.claro')) { p.tema = 'CLARO'; localStorage.setItem('blitz.prefs', JSON.stringify(p)); }
        localStorage.setItem('blitz.claro', '1');
        h.dataset.theme = p.tema || 'CLARO';   // padrão claro (branco + azul); escuro e alto contraste continuam nas preferências
        h.dataset.fonte = p.tamanhoFonte || 'MEDIO';
        if (p.reduzirAnimacoes) h.dataset.motion = 'reduzir';
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#app">Ir para o conteúdo</a>
    <div id="shell"></div>
    <main id="app" tabindex="-1" aria-live="polite">
      <!-- Tela 01: carregamento -->
      <div class="estado" role="status"><span class="spinner" aria-hidden="true"></span> Carregando o Blitz…</div>
    </main>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
